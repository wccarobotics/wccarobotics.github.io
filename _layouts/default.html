<!DOCTYPE html>
<html lang="en">
<head>
  {% if jekyll.environment == "production" %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QY2CQL8Y8B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QY2CQL8Y8B');
  </script>
  {% endif %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
</head>
<body{% if page.team_highlight %} data-team-highlight{% endif %}>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.team_highlight %}<script src="{{ '/assets/js/team-highlight.js' | relative_url }}"></script>{% endif %}
  {% if page.marcus_splash %}<script src="{{ '/assets/js/marcus-splash.js' | relative_url }}"></script>{% endif %}
  <script src="{{ '/assets/js/table-sort.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/bracket.js' | relative_url }}"></script>
</body>
</html>
